name: Portal

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # A Pages deployment and every pull-request build used to share one group.
  # GitHub keeps only one pending run in a concurrency group, so a burst of
  # Dependabot PRs could cancel the queued main deployment and leave the badge
  # reporting a failure. Keep repeated work for the same ref together without
  # letting independent PRs block or replace the deployable main run.
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build and analysis dependencies
        run: >-
          python -m pip install
          "platformio==6.1.19"
          -r requirements-analysis.txt
      - run: npm test
      - name: Test firmware and bundle tooling
        run: python -m unittest discover -s tests -v
      - name: Build validated firmware package
        env:
          SAUNA_SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python tools/build_web_flash_bundle.py
          --build
          --require-release-metadata
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: portal

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        name: Deploy GitHub Pages artifact
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
